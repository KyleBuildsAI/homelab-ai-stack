# homelab-ai-stack — Netdata Configuration

[global]
    run as user = netdata
    update every = 2
    memory mode = dbengine
    page cache size = 32
    dbengine multihost disk space = 256

[web]
    bind to = 0.0.0.0
    default port = 19999

[plugins]
    proc = yes
    cgroups = yes
    apps = yes
    go.d = yes
    python.d = yes

[plugin:proc]
    /proc/net/dev = yes
    /proc/diskstats = yes
    /proc/meminfo = yes
    /proc/stat = yes

[plugin:cgroups]
    search for cgroups in subpaths matching = *docker*
    enable by default cgroups matching = *hai-*
