###############################################################################
# homelab-ai-stack — Docker Compose
# Complete self-hosted AI infrastructure for commodity hardware
#
# Usage:
#   cp .env.example .env          # Configure your environment
#   ./scripts/setup.sh            # One-command bootstrap
#   docker compose up -d          # Launch the stack
#
# Architecture:
#   Client -> Gateway (auth/rate-limit) -> LiteLLM (router) -> Ollama (LLM)
#   Open WebUI -> LiteLLM -> Ollama
#   ChromaDB (vector store), Redis (cache/sessions), Netdata (monitoring)
###############################################################################

name: homelab-ai-stack

services:
  # ---------------------------------------------------------------------------
  # Ollama — Local LLM inference engine
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: hai-ollama
    hostname: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ai-internal
    deploy:
      resources:
        reservations:
          memory: ${OLLAMA_MEMORY_RESERVATION:-4G}
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-12G}

    # -------------------------------------------------------------------------
    # NVIDIA GPU Passthrough — Uncomment the block below if you have an
    # NVIDIA GPU with the nvidia-container-toolkit installed.
    #
    #   Install: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit
    #   Verify:  docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
    # -------------------------------------------------------------------------
    #   deploy:
    #     resources:
    #       reservations:
    #         devices:
    #           - driver: nvidia
    #             count: all          # or "1" for a single GPU
    #             capabilities: [gpu]
    #         memory: 4G
    #       limits:
    #         memory: 16G

    # -------------------------------------------------------------------------
    # AMD ROCm GPU Passthrough — Uncomment if you have an AMD GPU with
    # ROCm drivers installed. Requires amdgpu driver + rocm-docker.
    #
    #   Install: https://rocm.docs.amd.com/en/latest/deploy/docker.html
    # -------------------------------------------------------------------------
    #   image: ollama/ollama:rocm
    #   devices:
    #     - /dev/kfd:/dev/kfd
    #     - /dev/dri:/dev/dri
    #   group_add:
    #     - video
    #     - render
    #   environment:
    #     - HSA_OVERRIDE_GFX_VERSION=10.3.0  # Adjust for your GPU arch

  # ---------------------------------------------------------------------------
  # LiteLLM — Unified LLM API gateway / router
  # Provides OpenAI-compatible API across all backends
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-main-latest}
    container_name: hai-litellm
    hostname: litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_HOST_PORT:-4000}:4000"
    volumes:
      - ./litellm-config.yml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - LITELLM_LOG_LEVEL=${LITELLM_LOG_LEVEL:-INFO}
      - DATABASE_URL=sqlite:///app/data/litellm.db
      - OLLAMA_API_BASE=http://ollama:11434
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ai-internal
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Open WebUI — Feature-rich chat interface for LLMs
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_VERSION:-main}
    container_name: hai-open-webui
    hostname: open-webui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_HOST_PORT:-3000}:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_AUTH=${OPENWEBUI_AUTH:-true}
      - WEBUI_NAME=${OPENWEBUI_NAME:-Homelab AI}
      - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET_KEY:?Set OPENWEBUI_SECRET_KEY in .env}
      - ENABLE_SIGNUP=${OPENWEBUI_ENABLE_SIGNUP:-false}
      - DEFAULT_MODELS=${OPENWEBUI_DEFAULT_MODEL:-llama3.1:8b}
      - ENABLE_RAG_WEB_SEARCH=${OPENWEBUI_ENABLE_WEB_SEARCH:-false}
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=${OPENWEBUI_EMBEDDING_MODEL:-nomic-embed-text}
      - CHROMA_HTTP_HOST=chromadb
      - CHROMA_HTTP_PORT=8000
      - ENABLE_ADMIN_EXPORT=${OPENWEBUI_ENABLE_EXPORT:-true}
    depends_on:
      ollama:
        condition: service_healthy
      litellm:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ai-internal
    deploy:
      resources:
        limits:
          memory: 2G

  # ---------------------------------------------------------------------------
  # ChromaDB — Vector database for RAG / embeddings
  # ---------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:${CHROMADB_VERSION:-latest}
    container_name: hai-chromadb
    hostname: chromadb
    restart: unless-stopped
    ports:
      - "${CHROMADB_HOST_PORT:-8100}:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_SERVER_AUTHN_PROVIDER=${CHROMADB_AUTH_PROVIDER:-}
      - CHROMA_SERVER_AUTHN_CREDENTIALS=${CHROMADB_AUTH_CREDENTIALS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - ai-internal
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Redis — Caching, session storage, rate limiting backend
  # ---------------------------------------------------------------------------
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: hai-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --save 60 1000
      --loglevel warning
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-internal
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Gateway — Custom FastAPI auth/rate-limiting/usage-tracking proxy
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: hai-gateway
    hostname: gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    volumes:
      - gateway_data:/app/data
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8080
      - GATEWAY_LOG_LEVEL=${GATEWAY_LOG_LEVEL:-info}
      - GATEWAY_ADMIN_API_KEY=${GATEWAY_ADMIN_API_KEY:?Set GATEWAY_ADMIN_API_KEY in .env}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:?Set GATEWAY_JWT_SECRET in .env}
      - GATEWAY_JWT_EXPIRY_HOURS=${GATEWAY_JWT_EXPIRY_HOURS:-24}
      - LITELLM_UPSTREAM_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - REDIS_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      - RATE_LIMIT_RPM=${GATEWAY_RATE_LIMIT_RPM:-60}
      - RATE_LIMIT_TPM=${GATEWAY_RATE_LIMIT_TPM:-100000}
      - COST_PER_1K_INPUT_TOKENS=${GATEWAY_COST_INPUT:-0.0}
      - COST_PER_1K_OUTPUT_TOKENS=${GATEWAY_COST_OUTPUT:-0.0}
      - CORS_ORIGINS=${GATEWAY_CORS_ORIGINS:-*}
    depends_on:
      litellm:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ai-internal
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Netdata — Real-time performance monitoring
  # ---------------------------------------------------------------------------
  netdata:
    image: netdata/netdata:${NETDATA_VERSION:-stable}
    container_name: hai-netdata
    hostname: hai-netdata
    restart: unless-stopped
    ports:
      - "${NETDATA_HOST_PORT:-19999}:19999"
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - ./monitoring/netdata.conf:/etc/netdata/netdata.conf:ro
      - ./monitoring/alerts.yml:/etc/netdata/health.d/homelab-ai.conf:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN:-}
      - NETDATA_CLAIM_ROOMS=${NETDATA_CLAIM_ROOMS:-}
      - DOCKER_HOST=unix:///var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:19999/api/v1/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-internal
    deploy:
      resources:
        limits:
          memory: 512M

# =============================================================================
# Networks
# =============================================================================
networks:
  ai-internal:
    name: hai-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes — Named volumes for persistent data
# =============================================================================
volumes:
  ollama_data:
    name: hai-ollama-data
  openwebui_data:
    name: hai-openwebui-data
  chromadb_data:
    name: hai-chromadb-data
  redis_data:
    name: hai-redis-data
  gateway_data:
    name: hai-gateway-data
  netdata_config:
    name: hai-netdata-config
  netdata_lib:
    name: hai-netdata-lib
  netdata_cache:
    name: hai-netdata-cache
